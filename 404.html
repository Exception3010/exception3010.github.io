<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Hazem Oukal</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            --bg: #0b0f14;
            --panel: #0f141b;
            --text: #e6edf3;
            --muted: #9fb0c0;
            --brand: #3da9fc;
            --brand-2: #90b4ce;
            --border: #1b2632;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
            background: radial-gradient(1200px 800px at 10% -10%, #112236 0, transparent 40%),
                        radial-gradient(1000px 600px at 100% 10%, #101b2a 0, transparent 50%),
                        var(--bg);
            background-repeat: no-repeat, no-repeat, no-repeat;
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }
        header { background: rgba(11,15,20,0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
        .nav { display: flex; align-items: center; justify-content: space-between; padding: 10px clamp(12px, 4vw, 24px); }
        .brand { font-weight: 700; letter-spacing: 0.3px; }
        .brand small { color: var(--brand-2); font-weight: 500; margin-left: 8px; }
        .nav a { color: var(--text); opacity: .9; }
        .nav a:hover { opacity: 1; color: var(--brand); }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(16px, 5vw, 32px); }
        .panel { max-width: 560px; width: 100%; background: rgba(15,20,27,0.78); border: 1px solid var(--border); border-radius: 14px; padding: clamp(20px, 5vw, 36px); text-align: center; }
        .code { color: var(--brand-2); font-weight: 600; letter-spacing: 1px; margin: 0 0 6px; }
        h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.2; margin: 0 0 10px; }
        p { color: var(--muted); margin: 0 0 20px; }
        .cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .btn { display: inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-weight: 600; }
        .btn:hover { border-color: var(--brand); text-decoration: none; }
        .btn.primary { background: linear-gradient(180deg, #1287f0, #0e6cc3); border-color: #0e6cc3; }
        footer { padding: 26px clamp(12px, 4vw, 24px) 40px; color: var(--muted); text-align: center; }
        @media (max-width: 640px) {
            .nav { flex-direction: column; align-items: flex-start; gap: 6px; }
        }
    </style>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="theme-color" content="#0b0f14">
</head>
<body>
<header>
    <div class="nav">
        <div class="brand">Hazem Oukal <small>Computer Engineer</small></div>
        <nav aria-label="Primary">
            <a href="/">Home</a>
        </nav>
    </div>
</header>
<main>
    <div class="panel">
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>The page you are looking for does not exist or has moved.</p>
        <div class="cta">
            <a class="btn primary" href="/">Back to home</a>
            <a class="btn" href="/#projects">See projects</a>
        </div>
    </div>
</main>
<footer>
    <span>© <span id="year"></span> Hazem Oukal. All rights reserved.</span>
</footer>
<script>
    document.getElementById('year').textContent = new Date().getFullYear().toString();
</script>
</body>
</html>
